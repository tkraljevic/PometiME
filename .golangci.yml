version: "2"
run:
  timeout: 10m
  tests: true
  relative-path-mode: wd
linters:
  default: none
  enable:
    - govet
    - staticcheck
    - errcheck
    - ineffassign
    - unused
    - revive
    - gocyclo
    - gocognit
    - dupl
    - maintidx
    - nestif
    - nolintlint
  settings:
    errcheck:
      check-blank: true
      exclude-functions:
        - (*database/sql.Tx).Rollback
        - (*database/sql.Rows).Close
        - (*database/sql.Stmt).Close
        - (net.Conn).Close
        - (*crypto/tls.Conn).Close
        - (net.Listener).Close
        - (io.ReadCloser).Close
        - (*archive/zip.ReadCloser).Close
        - (mime/multipart.File).Close
        - (net/http.ResponseWriter).Write
        - fmt.Fprint(net/http.ResponseWriter)
        - fmt.Fprintf(net/http.ResponseWriter)
        - fmt.Fprintln(net/http.ResponseWriter)
        - io.WriteString(net/http.ResponseWriter)
        - (*bufio.Writer).Write
        - (*bufio.Writer).WriteString
        - (*bufio.Writer).WriteByte
        - (*bufio.Writer).WriteRune
        - fmt.Fprint(*bufio.Writer)
        - fmt.Fprintf(*bufio.Writer)
        - fmt.Fprintln(*bufio.Writer)
        - fmt.Fprint(hash.Hash)
        - fmt.Fprintf(hash.Hash)
        - fmt.Fprintln(hash.Hash)
    nolintlint:
      require-explanation: true
      require-specific: true
    staticcheck:
      checks: ["SA*"]
    gocyclo:
      min-complexity: 16
    gocognit:
      min-complexity: 30
    dupl:
      threshold: 150
    maintidx:
      under: 20
    nestif:
      min-complexity: 5
    revive:
      enable-default-rules: false
      rules:
        - name: atomic
        - name: context-keys-type
        - name: errorf
        - name: identical-branches
        - name: unreachable-code
  exclusions:
    presets: []
    generated: strict
    rules:
      - path: _test\.go$
        linters: [gocyclo, gocognit, dupl, maintidx, nestif]
      - path: _test\.go$
        linters: [errcheck]
        text: "\\.Close` is not checked"
      - linters: [errcheck]
        source: '^[[:space:]]*([^[:space:],:=;]+[[:space:]]*,[[:space:]]*)*_([[:space:]]*,[[:space:]]*[^[:space:],:=;]+)*[[:space:]]*:?=([^"''`;/{]|[^[:space:]"''`;/{]\{|"([^"\\]|\\.)*"|''([^''\\]|\\.)*''|`[^`]*`|/[^/"''`;{])*[[:space:]]//[[:space:]]*[^[:space:]]'
issues:
  uniq-by-line: false
  max-issues-per-linter: 0
  max-same-issues: 0
